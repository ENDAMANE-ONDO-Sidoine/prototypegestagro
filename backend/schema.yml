        specializations:
          type: object
          additionalProperties: {}
        expertise_areas:
          type: object
          additionalProperties: {}
        has_organic_certification:
          type: boolean
          title: Organic certification
        has_pest_control_certification:
          type: boolean
          title: Pest control certification
        has_soil_analysis_certification:
          type: boolean
          title: Soil analysis certification
