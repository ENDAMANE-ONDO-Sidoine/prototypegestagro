          type: string
          title: Emergency phone
          maxLength: 20
        current_location:
          type: object
          additionalProperties: {}
        preferred_working_hours:
          type: object
          additionalProperties: {}
        max_travel_distance_km:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Max travel distance (km)
        profile_photo:
          type: string
          format: uri
          nullable: true
        profile_photo_url:
          type: string
          readOnly: true
        certification_documents:
          type: object
          additionalProperties: {}
        field_photos:
          type: object
          additionalProperties: {}
        notes:
          type: string
        created_at:
          type: string
          format: date-time
