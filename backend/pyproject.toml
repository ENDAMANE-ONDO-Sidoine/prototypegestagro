[tool.poetry]
name = "gestagro-backend"
version = "0.1.0"
description = "Backend API pour la plateforme GestAgro"
authors = ["GestAgro Team <dev@gestagro.com>"]
readme = "README.md"
packages = [{include = "gestagro"}]

[tool.poetry.dependencies]
python = "^3.12"
Django = "^5.0"
djangorestframework = "^3.15.0"
django-cors-headers = "^4.3.1"
django-environ = "^0.11.2"
django-extensions = "^3.2.3"
django-filter = "^23.5"
django-ratelimit = "^4.1.0"
django-storages = "^1.14.2"
django-celery-beat = "^2.5.0"
django-celery-results = "^2.5.0"
celery = "^5.3.4"
redis = "^5.0.1"
psycopg2-binary = "^2.9.9"
Pillow = "^10.1.0"
gunicorn = "^21.2.0"
whitenoise = "^6.6.0"
drf-spectacular = "^0.26.5"
django-oauth-toolkit = "^1.7.1"
djangorestframework-simplejwt = "^5.3.0"
django-allauth = "^0.57.0"
boto3 = "^1.34.0"
opensearch-py = "^2.4.0"
python-decouple = "^3.8"
sentry-sdk = "^1.38.0"
django-health-check = "^3.17.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-django = "^4.7.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
factory-boy = "^3.3.0"
faker = "^20.1.0"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.1"
django-stubs = "^4.2.7"
pre-commit = "^3.6.0"
bandit = "^1.7.5"
safety = "^2.3.5"
locust = "^2.17.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_django = "django"
known_first_party = ["gestagro"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "FIRSTPARTY", "LOCALFOLDER"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "django.*",
    "rest_framework.*",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gestagro.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=gestagro --cov-report=html --cov-report=term-missing"
