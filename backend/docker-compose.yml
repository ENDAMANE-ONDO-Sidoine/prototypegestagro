version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:18
    container_name: gestagro_postgres
    environment:
      POSTGRES_DB: gestagro_db
      POSTGRES_USER: gestagro_user
      POSTGRES_PASSWORD: gestagro_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gestagro_network

  # MinIO S3 Storage
  minio:
    image: minio/minio:latest
    container_name: gestagro_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - gestagro_network

  # Redis (optionnel - vous avez déjà Redis Cloud)
  redis_local:
    image: redis:7-alpine
    container_name: gestagro_redis_local
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gestagro_network
    profiles:
      - local-redis  # Utilisez ce profil seulement si vous voulez Redis local

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  gestagro_network:
    driver: bridge