apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestagro-backend
  namespace: gestagro
  labels:
    app: gestagro-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gestagro-backend
  template:
    metadata:
      labels:
        app: gestagro-backend
    spec:
      containers:
      - name: gestagro-backend
        image: gestagro/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: gestagro-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: gestagro-secrets
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: gestagro-secrets
              key: secret-key
        envFrom:
        - configMapRef:
            name: gestagro-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gestagro-backend-service
  namespace: gestagro
spec:
  selector:
    app: gestagro-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
