services:
  - type: web
    name: gestagro-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && echo "=== Vérification fichiers source ===" && ls -la static/img/*.svg 2>/dev/null | wc -l || echo "0" && echo "=== Création staticfiles ===" && mkdir -p staticfiles && echo "=== Collectstatic ===" && python manage.py collectstatic --noinput --clear --verbosity 2 && echo "=== Vérification fichiers collectés ===" && ls -la staticfiles/img/ 2>/dev/null | head -10 || echo "ERREUR: Fichiers SVG non trouvés dans staticfiles/img/" && find staticfiles -name "*.svg" -type f | head -5 && python manage.py migrate && python scripts/auto_migrate_roles.py
    startCommand: gunicorn gestagro.wsgi:application --workers 1 --threads 2 --timeout 120 --max-requests 1000 --max-requests-jitter 50
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: gestagro.settings.production
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gestagro-db
          property: connectionString
    healthCheckPath: /api/v1/

databases:
  - name: gestagro-db
    plan: free
