services:
  - type: web
    name: gestagro-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn gestagro.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: gestagro.settings.production
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gestagro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gestagro-redis
          type: redis
          property: connectionString
    healthCheckPath: /api/v1/

databases:
  - name: gestagro-db
    plan: free

services:
  - type: redis
    name: gestagro-redis
    plan: free
