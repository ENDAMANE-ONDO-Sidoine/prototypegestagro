services:
  - type: web
    name: gestagro-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && mkdir -p static/img && python manage.py collectstatic --noinput --clear --verbosity 2 && python manage.py migrate && python scripts/auto_migrate_roles.py
    startCommand: gunicorn gestagro.wsgi:application --workers 1 --threads 2 --timeout 120 --max-requests 1000 --max-requests-jitter 50
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: gestagro.settings.production
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gestagro-db
          property: connectionString
    healthCheckPath: /api/v1/

databases:
  - name: gestagro-db
    plan: free
